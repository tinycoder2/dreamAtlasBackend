spring.application.name=dream-journal-api
google.cloud.project-id=${GOOGLE_CLOUD_PROJECT_ID:project-f148f1df-8994-412a-868}
google.cloud.project=${GOOGLE_CLOUD_PROJECT:project-f148f1df-8994-412a-868}
google.cloud.database-id=${GOOGLE_CLOUD_DATABASE_ID:(default)}
google.cloud.bigquery.dataset=${GOOGLE_CLOUD_BIGQUERY_DATASET:dream_atlas_health}

google.cloud.data-agent.location=us
google.cloud.data-agent.id=agent_2b7c9579-1d5d-469e-9b8b-399c0a5b99c2

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:3000}
server.port=8080
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.enabled=${SWAGGER_UI_ENABLED:true}
logging.level.root=DEBUG
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Google Health API
health.ingestion.minimum-interval-hours=${HEALTH_INGESTION_MINIMUM_INTERVAL_HOURS:12}
google.health.client-id=${GOOGLE_HEALTH_CLIENT_ID}
google.health.client-secret=${GOOGLE_HEALTH_CLIENT_SECRET}
google.health.redirect-uri=${GOOGLE_HEALTH_REDIRECT_URI:http://localhost:8080/api/health/google/callback}
google.health.app-callback-uri=dreamatlas://google-health-callback
